<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="UVA Wise SGA — column capital mark">
  <!-- White badge so the navy mark reads on both light and dark backgrounds -->
  <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="#0A1F44" stroke-width="2.5"/>
  <g fill="#0A1F44">
    <!-- Abacus (top slab) -->
    <rect x="23" y="18" width="54" height="6" rx="1.5"/>
    <!-- Volute scrolls at the capital's corners -->
    <circle cx="30" cy="27" r="6.2"/>
    <circle cx="70" cy="27" r="6.2"/>
    <!-- Echinus band beneath the abacus -->
    <path d="M25 24 H75 L69 33 H31 Z"/>
    <!-- Central palmette (fan of leaves) -->
    <path d="M50 20 C51.6 24 51.6 29 50 33 C48.4 29 48.4 24 50 20 Z" fill="#FFFFFF"/>
    <path d="M44 22 C46.4 25.5 47.4 30 47 33.5 C44.6 30.5 43.4 26 44 22 Z" fill="#FFFFFF"/>
    <path d="M56 22 C53.6 25.5 52.6 30 53 33.5 C55.4 30.5 56.6 26 56 22 Z" fill="#FFFFFF"/>
    <!-- Scroll "eyes" -->
    <circle cx="30" cy="27" r="2.1" fill="#FFFFFF"/>
    <circle cx="70" cy="27" r="2.1" fill="#FFFFFF"/>
    <!-- Neck -->
    <rect x="34" y="33" width="32" height="4.5"/>
    <!-- Fluted shaft -->
    <g>
      <rect x="35" y="39" width="5" height="38" rx="2"/>
      <rect x="41.25" y="39" width="5" height="38" rx="2"/>
      <rect x="47.5" y="39" width="5" height="38" rx="2"/>
      <rect x="53.75" y="39" width="5" height="38" rx="2"/>
      <rect x="60" y="39" width="5" height="38" rx="2"/>
    </g>
    <!-- Base mouldings -->
    <rect x="31" y="78" width="38" height="5.5" rx="1.5"/>
    <rect x="27" y="85" width="46" height="4.5" rx="1.5"/>
  </g>
</svg>
